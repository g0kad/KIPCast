; Updates the ESP32-C6 WiFi chip on a Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1
; to the ESP-Hosted firmware KIPCast is built against. Set the screen up with
; KIPCast first: this reads the WiFi details KIPCast saved. Then
;
;   pio run -d kipcast-display/tools/c6-update -t upload -t monitor
;
; and install KIPCast again once it reports "Versions Match".

[env:c6-update]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-p4_r3
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 400000000L
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=3
