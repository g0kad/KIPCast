name: Plugin

on:
  push:
    branches: [main]
    paths: ['signalk-kipcast/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['signalk-kipcast/**', '.github/workflows/plugin.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalk-kipcast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signalk-kipcast/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
