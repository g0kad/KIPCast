<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIPCast viewer</title>
<style>
  :root {
    --chart-table: #1c2733;
    --housing: #0e1216;
    --glass: #000;
    --ink: #d7dee6;
    --dim: #7d8a97;
    --ok: #5fc48a;
    --warn: #e0a53b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--chart-table); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(100vw - 24px, 880px); }
  .unit {
    background: var(--housing); padding: 28px 28px 22px; border-radius: 14px;
    box-shadow: inset 0 1px 0 #2a323b, 0 18px 40px rgb(0 0 0 / .45);
  }
  canvas {
    display: block; width: 100%; aspect-ratio: 800 / 480; background: var(--glass);
    touch-action: none; cursor: crosshair; border-radius: 2px;
  }
  .strip { display: flex; gap: 16px; align-items: center; margin-top: 14px; color: var(--dim); font-size: 13px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .led.on { background: var(--ok); }
  .strip label { margin-left: auto; }
  input { width: 9em; background: #1a2027; color: var(--ink); border: 1px solid #2d3640; border-radius: 4px; padding: 3px 6px; font: inherit; }
  input:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <div class="unit">
    <canvas id="screen" width="800" height="480" aria-label="Remote KIP dashboard"></canvas>
    <div class="strip">
      <span class="led" id="led"></span>
      <span id="state">Connecting…</span>
      <span id="fps"></span>
      <label>Display id <input id="dispId" spellcheck="false"></label>
    </div>
  </div>
</main>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const led = document.getElementById('led');
  const state = document.getElementById('state');
  const fpsEl = document.getElementById('fps');
  const idInput = document.getElementById('dispId');

  const params = new URLSearchParams(location.search);
  idInput.value = params.get('id') || 'viewer';
  idInput.addEventListener('change', () => {
    params.set('id', idInput.value);
    location.search = params.toString();
  });

  let ws, frames = 0;
  setInterval(() => { fpsEl.textContent = frames ? `${frames} fps` : ''; frames = 0; }, 1000);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws?id=${encodeURIComponent(idInput.value)}`);
    ws.binaryType = 'blob';
    ws.onopen = () => { led.classList.add('on'); state.textContent = `Connected as “${idInput.value}”`; };
    ws.onclose = () => {
      led.classList.remove('on');
      state.textContent = 'Disconnected. Retrying in 2 s';
      setTimeout(connect, 2000);
    };
    ws.onmessage = async (ev) => {
      if (!(ev.data instanceof Blob)) return;
      try {
        const bmp = await createImageBitmap(ev.data);
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close();
        frames++;
      } finally {
        if (ws.readyState === 1) ws.send('A'); // ready for the next frame
      }
    };
  }

  // Touch/mouse → display pixel coordinates, same as the ESP32 sends.
  function toPx(e) {
    const r = canvas.getBoundingClientRect();
    return [
      Math.round((e.clientX - r.left) * canvas.width / r.width),
      Math.round((e.clientY - r.top) * canvas.height / r.height),
    ];
  }
  const send = (s) => { if (ws && ws.readyState === 1) ws.send(s); };
  let down = false, lastMove = 0;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    down = true;
    const [x, y] = toPx(e);
    send(`T D ${x} ${y}`);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!down || e.timeStamp - lastMove < 30) return;
    lastMove = e.timeStamp;
    const [x, y] = toPx(e);
    send(`T M ${x} ${y}`);
  });
  const up = (e) => {
    if (!down) return;
    down = false;
    const [x, y] = toPx(e);
    send(`T U ${x} ${y}`);
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  connect();
})();
</script>
</body>
</html>
