; KIPCast display — Waveshare ESP32-S3-Touch-LCD-7
;
; ESP32_Display_Panel v1.x needs arduino-esp32 core 3.x. The official
; espressif32 platform still ships core 2.x, so this uses the community
; pioarduino platform, which tracks core 3.x.

[env:kipcast-display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3N16R8: 16 MB QIO flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB-C port. Set to 0 if you use the UART USB-C port instead.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Lets the display library find include/esp_panel_board_custom_conf.h
    -I include

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git
    bitbank2/JPEGDEC
