; KIPCast display firmware, one build per supported board:
;
;   pio run -e kipcast-display -t upload       Waveshare ESP32-S3-Touch-LCD-7 (800x480)
;   pio run -e kipcast-display-4in -t upload   Waveshare ESP32-S3-Touch-LCD-4 Rev4 (480x480)
;   pio run -e kipcast-display-43in -t upload  Waveshare ESP32-S3-Touch-LCD-4.3 (800x480)
;   pio run -e kipcast-display-p4-10in -t upload
;                                              Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1
;                                              (1280x800, untested on hardware)
;   pio run -e kipcast-display-crowpanel-10in -t upload
;                                              Elecrow CrowPanel Advanced 10.1" ESP32-P4 V1.1
;                                              (1024x600, untested on hardware)
;   pio run -e kipcast-display-p4-7b -t upload       (or -p4-7b-prev3 for a v1.3 chip)
;                                              Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
;                                              (1024x600, untested on hardware)
;
; Each board's panel config lives in include/boards/<board>/.
;
; ESP32_Display_Panel v1.x needs arduino-esp32 core 3.x. The official
; espressif32 platform still ships core 2.x, so this uses the community
; pioarduino platform, which tracks core 3.x.

[platformio]
default_envs = kipcast-display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3N16R8 on all boards: 16 MB QIO flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial over the native USB-C port.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Firmware version: the release build sets KIPCAST_VERSION from the git tag.
    '-DKIPCAST_VERSION="${sysenv.KIPCAST_VERSION}"'
    -I include

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git
    bitbank2/JPEGDEC

[env:kipcast-display]
; Waveshare ESP32-S3-Touch-LCD-7
build_flags =
    ${env.build_flags}
    ; Lets the display library find this board's esp_panel_board_custom_conf.h
    -I include/boards/lcd7

[env:kipcast-display-4in]
; Waveshare ESP32-S3-Touch-LCD-4, Rev4.0 (CH32V003 IO expander)
build_flags =
    ${env.build_flags}
    -I include/boards/lcd4
    -DKIPCAST_BOARD_LCD4
    -DSCREEN_W=480
    -DSCREEN_H=480

[env:kipcast-display-43in]
; Waveshare ESP32-S3-Touch-LCD-4.3 / 4.3B: the 7" board's hardware in a
; smaller size, so it runs the 7" config (see include/boards/lcd43)
build_flags =
    ${env.build_flags}
    -I include/boards/lcd43
    -DKIPCAST_BOARD_LCD43

[env:kipcast-display-p4-10in]
; Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1: ESP32-P4 (rev 3) with an
; ESP32-C6 for WiFi, 800x1280 MIPI-DSI panel. Shown in landscape: the
; firmware rotates frames and touch (KIPCAST_ROTATION, counter-clockwise).
board = esp32-p4_r3
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 400000000L
; Serial is the board's USB-UART port, so no ARDUINO_USB_CDC_ON_BOOT here.
build_flags =
    -DBOARD_HAS_PSRAM
    '-DKIPCAST_VERSION="${sysenv.KIPCAST_VERSION}"'
    -I include
    -I include/boards/p4-10in
    -DKIPCAST_BOARD_P4_10IN
    -DSCREEN_W=1280
    -DSCREEN_H=800
    -DKIPCAST_ROTATION=90
    ; 1280x800 frames run about 2.5x the size of 800x480 ones.
    -DMAX_JPEG_BYTES=655360

[env:kipcast-display-crowpanel-10in]
; Elecrow CrowPanel Advanced 10.1" ESP32-P4, V1.1: pre-rev-3 ESP32-P4 with
; an ESP32-C6 for WiFi, 1024x600 landscape MIPI-DSI panel, so no rotation.
board = esp32-p4
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 360000000L
; Serial is the board's USB-UART port, so no ARDUINO_USB_CDC_ON_BOOT here.
build_flags =
    -DBOARD_HAS_PSRAM
    '-DKIPCAST_VERSION="${sysenv.KIPCAST_VERSION}"'
    -I include
    -I include/boards/crowpanel-10in
    -DKIPCAST_BOARD_CROWPANEL_10IN
    -DSCREEN_W=1024
    -DSCREEN_H=600
    -DMAX_JPEG_BYTES=524288

[env:kipcast-display-p4-7b]
; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B with a rev 3 ESP32-P4 (current
; boards): 1024x600 landscape MIPI-DSI panel, ESP32-C6 for WiFi on the
; core's default pins. Early boards have a rev 1.3 chip: use -prev3 below.
board = esp32-p4_r3
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 400000000L
; Serial is the board's USB-UART port, so no ARDUINO_USB_CDC_ON_BOOT here.
build_flags =
    -DBOARD_HAS_PSRAM
    '-DKIPCAST_VERSION="${sysenv.KIPCAST_VERSION}"'
    -I include
    -I include/boards/p4-7b
    -DKIPCAST_BOARD_P4_7B
    -DSCREEN_W=1024
    -DSCREEN_H=600
    -DMAX_JPEG_BYTES=524288

[env:kipcast-display-p4-7b-prev3]
; The same board with a pre-rev-3 (v1.3) ESP32-P4. `esptool chip-id` shows
; which: a build for one revision won't start on the other.
extends = env:kipcast-display-p4-7b
board = esp32-p4
board_build.f_cpu = 360000000L
